name: CI/CD

# PR → valida (lint, tipos, testes).
# Push na main → valida e faz deploy em produção: migrations D1 → API (Workers + DO) → Web (Pages) → smoke test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # botão "Run workflow" para redeploy manual

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    name: Deploy produção
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false # nunca interrompe um deploy no meio
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verificar configuração
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID KV_NAMESPACE_ID API_URL WEB_URL JWT_SECRET TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Configure '$name' (veja docs/DEPLOY.md)"; missing=1; fi
          done
          # As chaves de teste do Turnstile sempre passam: em produção deixariam qualquer bot entrar.
          case "$TURNSTILE_SITE_KEY$TURNSTILE_SECRET_KEY" in
            *x00000000000000000000*) echo "::error::Use as chaves REAIS do Turnstile em produção (veja docs/DEPLOY.md)"; missing=1 ;;
          esac
          exit $missing
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Injetar IDs do D1 e do KV no wrangler.toml
        working-directory: apps/api
        run: |
          sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
          sed -i "s/^id = .*/id = \"$KV_NAMESPACE_ID\"/" wrangler.toml
          grep -E "^(database_id|id) = " wrangler.toml

      # Migrations antes do código novo: só mudanças compatíveis (adicionar colunas/tabelas). Ver docs/DEPLOY.md.
      - name: Aplicar migrations no D1
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply comandai-db --remote

      # Antes do deploy: a API nova recusa cadastro, login e pedidos sem o secret (falha fechada, ADR-0007).
      - name: Sincronizar TURNSTILE_SECRET_KEY
        working-directory: apps/api
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: printf '%s' "$TURNSTILE_SECRET_KEY" | pnpm exec wrangler secret put TURNSTILE_SECRET_KEY

      - name: Deploy da API (Workers + Durable Object)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --minify --var "ALLOWED_ORIGIN:$WEB_URL"

      - name: Sincronizar JWT_SECRET
        working-directory: apps/api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: printf '%s' "$JWT_SECRET" | pnpm exec wrangler secret put JWT_SECRET

      - name: Build do front
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm run build

      - name: Deploy do front (Pages)
        working-directory: apps/web
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name comandai
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --pretty=%s | head -c 300)"

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$API_URL/health"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$WEB_URL"
          echo "### 🚀 Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
